<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <title>TaskLite</title>
  </head>
  <body class="todo">
    <header class="header">
      <div class="container header__container">
        <h3 class="header__title">TaskLite</h3>

        <nav class="tabs">
          <a href="index.html" class="tab active">To Do</a>
          <a href="kanban.html" class="tab">Kanban</a>
        </nav>
      </div>
    </header>
    <main class="container">
      <h1 class="title">Задачи</h1>
      <form class="form-add">
        <input
          type="text"
          class="form-add__input"
          placeholder="Введите задачу"
        />
        <button type="submit" class="form-add__button">Добавить</button>
      </form>
      <div class="toolbar">
        <input type="text" class="toolbar__search" placeholder="Поиск задачи" />

        <div class="toolbar__tabs tabs">
          <button class="tabs__item tabs__item--active">Все</button>
          <button class="tabs__item">Активные</button>
          <button class="tabs__item">Завершенные</button>
        </div>
        <select class="toolbar__sort">
          <option value="new">Сначала новые</option>
          <option value="old">Сначала старые</option>
          <option value="az">Название A-Z</option>
          <option value="za">Название Z-A</option>
        </select>
      </div>

      <div class="tasks"></div>
      <footer class="footer-controls">
        <div class="footer-controls__counters">
          <span> Всего: 1 </span>
          <span> Активных: 1 </span>
          <span> Выполненных: 1 </span>
        </div>
        <button class="footer-controls__button button--clear">
          Очистить выполненные
        </button>
      </footer>
    </main>
    <!-- <script src="./js/task.js"></script> -->
    <script src="./js/main.js"></script>
  </body>
</html>
